name: Lint & Syntax Checks

permissions:
  contents: read

on:
  push:
    branches: [ main, "codex/shade-raid-v2-*" ]
  pull_request:
    branches: [ main, 'codex/shade-raid-v2*' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ShellCheck & Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck lua5.4

      - name: Run Python tests
        run: python -m unittest discover -s dotfiles_api/tests

      - name: Check Shell Script Syntax & Lint
        run: |
          find . -name "*.sh" -print0 | xargs -0 -r shellcheck

      - name: Check Lua Syntax
        run: |
          find . -name "*.lua" -exec luac -p {} +

  arch-regressions:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install Arch test tools
        run: pacman -Syu --noconfirm --needed python python-pip git sudo fish shellcheck
      - uses: actions/checkout@v4
      - name: Run regressions and disposable login installation
        env:
          SHADE_RAID_DISPOSABLE_ARCH: "1"
        run: python -m unittest discover -s dotfiles_api/tests
      - name: Validate bootstrap and Fish
        run: |
          shellcheck scripts/*.sh .config/install/install.sh
          fish -n home/.config/fish/config.fish
      - name: Install isolated CLI twice
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/.local/share"
          bash scripts/install-cli.sh
          "$HOME/.local/bin/dotfiles" --help
          bash scripts/install-cli.sh
          "$HOME/.local/bin/dotfiles" --help
